<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOUR brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#000000; --muted:#5f5f5f; --line:#d9d9d9; --plate:#ffffff; --plate-ink:#000000;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0e0e0e; --ink:#f5f5f5; --muted:#a3a3a3; --line:#2e2e2e; }
}
:root[data-theme="dark"]{ --bg:#0e0e0e; --ink:#f5f5f5; --muted:#a3a3a3; --line:#2e2e2e; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.wordmark{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:22px;letter-spacing:.08em;direction:ltr;text-decoration:none}
.bar a.link{font-size:15px;text-decoration:none;border-bottom:1px solid var(--ink)}
.hero{background:var(--plate);color:var(--plate-ink);display:flex;flex-direction:column;align-items:center;padding:48px 20px 40px;text-align:center}
.hero img{width:min(420px,78vw);height:auto;display:block;animation:rise .9s ease-out both}
.hero p{margin:8px 0 0;font-size:18px;max-width:30ch}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero img{animation:none}}
main{max-width:1040px;margin:0 auto;padding:56px 20px 72px}
h2{font-size:28px;margin:0 0 28px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:44px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr;gap:32px}}
.item img{width:100%;height:auto;display:block;background:#8f8f8f}
.item h3{font-size:20px;font-weight:600;margin:16px 0 4px}
.item .desc{margin:0;color:var(--muted);font-size:15px;max-width:44ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.price{font-size:24px;font-weight:600}
.price small{font-size:15px;font-weight:400;color:var(--muted);margin-inline-start:4px}
.size{font-size:14px;border:1px solid var(--ink);padding:2px 12px;direction:ltr}
.order{display:none;margin-top:14px;width:100%;padding:13px 18px;background:var(--ink);color:var(--bg);border:0;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}
.order.on{display:block}
footer{border-top:1px solid var(--line);padding:24px 20px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="bar">
  <a class="wordmark" href="#top">NOUR brands</a>
  <a class="link" href="#products">المنتجات</a>
</header>
